<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F6F7F9">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://rgatu-calendar-api.ivan-s-2001.workers.dev; object-src 'none'; base-uri 'none'">
  <title>Расписание заочников РГАТУ</title>
  <link rel="stylesheet" href="app.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">
  <script src="pwa.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i class="icon" data-icon="calendar"></i></span><div><b>РГАТУ</b><span>имени П. А. Соловьёва · Рыбинск</span></div></div>
      <button class="icon-button" data-action="search-toggle" aria-label="Поиск по расписанию"><i class="icon" data-icon="search" aria-hidden="true"></i></button>
    </header>
    <main id="main"><div class="skeleton" aria-label="Загрузка расписания"></div></main>
    <nav class="bottom-nav" aria-label="Основные разделы">
      <button data-nav="schedule" aria-current="page"><i class="icon" data-icon="calendar" aria-hidden="true"></i><span>Расписание</span></button>
      <button data-nav="university"><i class="icon" data-icon="school" aria-hidden="true"></i><span>Университет</span></button>
      <button data-nav="settings"><i class="icon" data-icon="settings" aria-hidden="true"></i><span>Настройки</span></button>
    </nav>
  </div>
  <div id="overlay" class="overlay" hidden>
    <div class="scrim" data-action="close-modal"></div>
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"></section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
